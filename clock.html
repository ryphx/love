<!DOCTYPE html>
<html lang="en" >

<head>
  
  <meta charset="UTF-8">
  
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

 
   

  <title>clock love</title>

 
  
  
<style>
body {
    text-align: center;
    padding: 70px 50px;
    background: #ffb457;
    font-family: sans-serif;
    font-weight: lighter;
    background: none;
}

#timer {
    font-size: 3em;
    font-weight: 100;
    color: white;
    text-shadow: 0 0 20px #ffb457;
}

#timer div {
    display: inline-block;
    min-width: 90px;
}

#timer div span {
    color: #fff;
    display: block;
    font-size: .35em;
    font-weight: 400;
}

.cont{
  max-width: 500px;
  width: 100%;
  margin: 0 auto;
  line-height: 55px;
   min-height: 100vh;
  display: grid;
  place-items: center;
}
body{
  overflow: hidden;
}
</style>

  <script>
  window.console = window.console || function(t) {};
</script>

  
  
</head>

<body translate="no">
  <div class="cont">

  <div id="timer"></div>

  </div>
    <script id="rendered-js" >
function updateTimer() {
 // const today = new Date();
//const dayOfMonth = today.getDate(); 

//console.log(dayOfMonth); // Example output: 16

  future = Date.parse("October 16, 2026 19:30:00");
  now = new Date();
  diff = future - now;

  days = Math.floor(diff / (1000 * 60 * 60 * 24));
  hours = Math.floor(diff / (1000 * 60 * 60));
  mins = Math.floor(diff / (1000 * 60));
  secs = Math.floor(diff / 1000);

  d = days;
  h = hours - days * 24;
  m = mins - hours * 60;
  s = secs - mins * 60;

  document.getElementById("timer").
  innerHTML =
  '<div>' + d + '<span>days</span></div>' +
  '<div>' + h + '<span>hours</span></div>' +
  '<div>' + m + '<span>minutes</span></div>' +
  '<div>' + s + '<span>seconds</span></div>';
}
setInterval('updateTimer()', 1000);
//# sourceURL=pen.js
  </script>

  
</body>

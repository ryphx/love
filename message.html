<style>
@import url('https://fonts.googleapis.com/css?family=Raleway:100');

body{
  background-color:#AB3B56;
  padding:5% 0;
  font-family: 'Raleway', sans-serif;
  text-align:center;
  color:#FFF;
}

p {
  font-size: 36px;
}

span { 
  color:#e8e8e8;
}
.cont{
  max-width: 500px;
  width: 100%;
  margin: 0 auto;

   min-height: 100vh;
  display: grid;
  place-items: center;
}
</style>

  <script>
  window.console = window.console || function(t) {};
</script>

  
  
</head>

<body translate="no">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
<div class="cont">
<p class="opacity-5">
I love you,<br />
You Got This,<br />
I got you,
And you got me,
We got it,
Stay strong pony boy,
(ass slap and grab),
(ass slap and grab),
keesis.
</p>
  </div>
    <script id="rendered-js" >
textFead(".opacity-5");

function textFead(paragraph) {

  var words = $(paragraph).text().split(" ");
  $(paragraph).empty();

  $.each(words, function (i, v) {
    $(paragraph).append($("<span>").text(v + " "));
  });

  var num = 0;

  $(paragraph).find("span").each(
  function () {
    $(this).delay(num).animate({ color: "#FD7E57" }, 1000);

    num = num + 500;
  });


}
//# sourceURL=pen.js
  </script>

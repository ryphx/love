    <script id=&quot;rendered-js&quot; >
var $canvas = $('#can'),
ctx = $canvas[0].getContext(&quot;2d&quot;),
w = $canvas.parent().width() - 1,
h = $canvas.parent().height() - 3,
RAD = 40,
peers = [];


function main() {
  init();
  animate();
  network.init();
  console.log('started');
}

function init() {
  $canvas[0].width = w;
  $canvas[0].height = h;
  peers.push(new peerCont(null, null, getColor(), 0, 0, false, chance.name()));
  $('.user .name').text(peers[0].name);

  $(window).mousemove(function (e) {
    peers[0].active = 1;
    peers[0].x = e.pageX;
    peers[0].y = e.pageY;
  }).on(&quot;keydown&quot;, function (e) {
    if (e.which == 13) {
      chat.active ? chat.disable() : chat.activate();
    }
  });
  document.oncontextmenu = new Function(&quot;return false;&quot;);
}

function draw() {
  for (var i = 0; i < peers.length; i++) {
    if (!peers[i].active) continue;
    drawCircle(peers[i].x, peers[i].y, RAD, peers[i].color);
  }
}

function drawCircle(x, y, rad, color) {
  ctx.beginPath();
  ctx.fillStyle = color;
  ctx.arc(x, y, rad, 0, 2 * Math.PI);
  ctx.fill();
}


function animate() {
  ctx.clearRect(0, 0, w, h);
  draw();
  network.send(peers[0].x, peers[0].y);
  network.kickClosed();
  requestAnimationFrame(animate);
}

function getColor() {
  return &quot;rgb(&quot; + rand(255) + &quot;,&quot; + rand(255) + &quot;,&quot; + rand(255) + &quot;)&quot;;
}

function rand(x) {
  return ~~(Math.random() * x);
}

function tellUser() {}

function peerCont(id, peer, color, x, y, active, name) {
  this.x = null;
  this.y = null;
  this.id = id;
  this.color = color;
  this.active = null;
  this.peer = peer;
  this.name = name;
}


var network = {
  num: 0,
  ids: ids = ['a123', 'b123', 'c123', 'd123', 'e123', 'f123', 'g123', 'h123', 'i123', 'j123', 'k123', 'l123'],
  send: function (x, y) {
    for (var i = 1; i < peers.length; i++) {
      peers[i].peer.send([&quot;cords&quot;, x, y]);
    }
  },
  init: function () {
    this.getId();
  },
  getId: function () {
    var x;
    x = new Peer(ids[this.num], {
      key: '0of84d1q9f0cc8fr' });

    x.on('open', function (id) {
      chat.update(&quot;Game&quot;, &quot;Connected To Server..Your Id: &quot; + ids[network.num]);
      peers[0].peer = x;
      peers[0].id = network.ids[network.num];
      network.connectToPeers();
    });
    x.on('error', function (err) {
      if (err.type != &quot;unavailable-id&quot;) return;
      if (network.num < network.ids.length - 1) {
        network.num++;
        network.getId();
      } else {
        network.full();
      }

    });
  },
  full: function () {
    chat.update(&quot;Game&quot;, &quot;Slots Full try refereshing in few seconds!&quot;);
  },

  kickClosed: function () {
    peers.forEach(function (x, i) {
      if (x.peer &amp;&amp; !x.peer.open) {
        chat.update(x.name, 'dropped');
        peers.splice(i, 1);
        chat.removeUser(x.name);
      }
    });
  },
  connectToPeers: function () {
    this.ids.forEach(function (x, i) {
      if (peers[0].id == x) {
        return;
      }

      var con = peers[0].peer.connect(x);
      con.on('open', network.addPeer);
    });

    peers[0].peer.on('connection', function (x) {
      x.on('open', network.addPeer);
    });
  },
  addPeer: function (id) {
    var x = new peerCont(id, this);
    peers.push(x);
    console.log(peers);
    this.on('data', function (data) {
      if (data == &quot;getData&quot;) {
        console.log(&quot;sending Name&quot;);
        this.send(
        [&quot;hereisData&quot;, peers[0].name, peers[0].color, peers[0].x, peers[0].y]);
      }
      if (data[0] == &quot;hereisData&quot;) {
        console.log(&quot;revd. Name&quot;);
        chat.update(data[1], 'connected');
        console.log(data[1]);
        x.name = data[1];
        x.color = data[2];
        x.x = data[3];
        x.y = data[4];
        x.active = 1;
        x.id = x.peer.id;
        chat.addUser(x);
      } else if (data[0] == &quot;cords&quot;) {
        x.x = data[1];
        x.y = data[2];
      } else if (data[0] == &quot;msg&quot;) {
        chat.update(x.name, data[1]);
      }
    });
    network.getData(this);
  },

  getData: function (x) {
    x.send(&quot;getData&quot;);
  } };



var chat = {
  log: $('.console .log'),
  ele: $('.console .chat'),
  active: false,
  activate: function () {
    this.active = true;
    this.ele.focus().addClass('outl');
  },
  disable: function () {
    this.active = false;
    this.update('you', this.ele.val());
    this.ele.blur().val(&quot;&quot;).removeClass('outl');
  },
  update: function (user, msg) {
    var p = $('<p></p>').text(user + &quot;: &quot; + msg);
    if (user == &quot;you&quot;) this.submit(msg);
    setTimeout(function () {
      p.fadeOut(300, function () {
        $(this).remove();
      });
    }, 4000);
    this.log.append(p);
  },
  submit: function (msg) {
    for (var i = 1; i < peers.length; i++) {
      peers[i].peer.send([&quot;msg&quot;, msg]);
    }
  },
  addUser: function (x) {
    console.log(x);
    var p = $('.user ol li').clone();
    p.find('.name').text(x.name);
    p.appendTo($('.user ol'));
  },
  removeUser: function (x) {
    $('.user ol li').has('span:contains(' + x + ')').remove();
  } };

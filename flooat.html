  <title>Floatting Draggable Menu (Messenger like) </title>

    <link rel="canonical" href="https://codepen.io/andyNroses/pen/rLRZgY">
  
  
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/foundicons/3.0.0/foundation-icons.css'>
<link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/foundicons/3.0.0/svgs/fi-list.svg'>
  
<style>
@import 'https://fonts.googleapis.com/css?family=Open+Sans';
body {
  background-color: #222222;
  color: white;
  font-family: "Open Sans", sans-serif;
  font-size: 12px;
}

h2 {
  position: absolute;
  left: 20px;
  top: 0px;
  z-index: -1;
}

.center {
  position: absolute;
  margin: auto;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
}

.menu {
  width: 40px;
  height: 40px;
}

.title {
  width: 300px;
  height: 10px;
  top: 60px;
}

.item {
  position: absolute;
  left: 0px;
  top: 0px;
  width: 40px;
  height: 40px;
  background-color: white;
  -moz-border-radius: 50%;
  -webkit-border-radius: 50%;
  border-radius: 50%;
  cursor: pointer;
  text-align: center;
  line-height: 40px;
}

i {
  font-size: 24px;
  color: #222222;
}
</style>

  <script>
  window.console = window.console || function(t) {};
</script>

<body translate="no">
  <div class="center menu">
    <div id="myMenu"></div>
</div>
<div class="center title">
    <h2>Drag the menu where you want!</h2>
</div>
  <script src='https://code.jquery.com/jquery-2.2.4.min.js'></script>
<script src='https://code.jquery.com/ui/1.12.0/jquery-ui.js'></script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/animejs/1.0.0/anime.js'></script>
    <script id="rendered-js" >
var timeOut;

class Item {
  constructor(icon, backgroundColor) {
    this.$element = $(document.createElement("div"));
    this.icon = icon;
    this.$element.addClass("item");
    this.$element.css("background-color", backgroundColor);
    var i = document.createElement("i");
    $(i).addClass("fi-" + icon);
    this.$element.append(i);
    this.prev = null;
    this.next = null;
    this.isMoving = false;
    var element = this;
    this.$element.on("mousemove", function () {
      clearTimeout(timeOut);
      timeOut = setTimeout(function () {
        if (element.next && element.isMoving) {
          element.next.moveTo(element);
        }
      }, 10);
    });
  }

  moveTo(item) {
    anime({
      targets: this.$element[0],
      left: item.$element.css("left"),
      top: item.$element.css("top"),
      duration: 700,
      elasticity: 500 });

    if (this.next) {
      this.next.moveTo(item);
    }
  }

  updatePosition() {
    anime({
      targets: this.$element[0],
      left: this.prev.$element.css("left"),
      top: this.prev.$element.css("top"),
      duration: 80 });


    if (this.next) {
      this.next.updatePosition();
    }
  }}


class Menu {
  constructor(menu) {
    this.$element = $(menu);
    this.size = 0;
    this.first = null;
    this.last = null;
    this.timeOut = null;
    this.hasMoved = false;
    this.status = "closed";
  }

  add(item) {
    var menu = this;
    if (this.first == null) {
      this.first = item;
      this.last = item;
      this.first.$element.on("mouseup", function () {
        if (menu.first.isMoving) {
          menu.first.isMoving = false;
        } else {
          menu.click();
        }
      });
      item.$element.draggable(
      {
        start: function () {
          menu.close();
          item.isMoving = true;
        } },

      {
        drag: function () {
          if (item.next) {
            item.next.updatePosition();
          }
        } },

      {
        stop: function () {
          item.isMoving = false;
          item.next.moveTo(item);
        } });


    } else {
      this.last.next = item;
      item.prev = this.last;
      this.last = item;
    }
    this.$element.after(item.$element);


  }

  open() {
    this.status = "open";
    var current = this.first.next;
    var iterator = 1;
    var head = this.first;
    var sens = head.$element.css("left") < head.$element.css("right") ? 1 : -1;
    while (current != null) {if (window.CP.shouldStopExecution(0)) break;
      anime({
        targets: current.$element[0],
        left: parseInt(head.$element.css("left"), 10) + sens * (iterator * 50),
        top: head.$element.css("top"),
        duration: 500 });

      iterator++;
      current = current.next;
    }window.CP.exitedLoop(0);
  }

  close() {
    this.status = "closed";
    var current = this.first.next;
    var head = this.first;
    var iterator = 1;
    while (current != null) {if (window.CP.shouldStopExecution(1)) break;
      anime({
        targets: current.$element[0],
        left: head.$element.css("left"),
        top: head.$element.css("top"),
        duration: 500 });

      iterator++;
      current = current.next;
    }window.CP.exitedLoop(1);
  }

  click() {
    if (this.status == "closed") {
      this.open();
    } else {
      this.close();
    }
  }}



var menu = new Menu("#myMenu");
var item1 = new Item("list");
var item2 = new Item("torso", "#FF5C5C");
var item3 = new Item("social-facebook", "#5CD1FF");
var item4 = new Item("paypal", "#FFF15C");
var item5 = new Item("link", "#64F592");

menu.add(item1);
menu.add(item2);
menu.add(item3);
menu.add(item4);
menu.add(item5);
$(document).delay(50).queue(function (next) {
  menu.open();
  next();
  $(document).delay(1000).queue(function (next) {
    menu.close();
    next();
  });
});
//# sourceURL=pen.js
  </script>

  
</body>

</html>
